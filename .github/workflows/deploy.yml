name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deployment mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - quick
          - full

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_mode: ${{ steps.pick.outputs.deploy_mode }}
      changed_files: ${{ steps.pick.outputs.changed_files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick deployment mode
        id: pick
        run: |
          set -e

          requested="${{ inputs.deploy_mode || 'auto' }}"
          if [ "$requested" = "quick" ] || [ "$requested" = "full" ]; then
            echo "deploy_mode=$requested" >> "$GITHUB_OUTPUT"
            echo "changed_files=manual-$requested" >> "$GITHUB_OUTPUT"
            echo "Manual deployment mode: $requested"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [ -z "$base" ] || [ "$base" = "$zero_sha" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="$(git rev-parse "${head}^")"
            else
              base="$head"
            fi
          fi

          changed_files="$(git -c core.quotePath=false diff --name-only "$base" "$head" || true)"
          printf 'Changed files:\n%s\n' "$changed_files"

          changed_file_list="$(mktemp)"
          printf '%s\n' "$changed_files" > "$changed_file_list"

          mode="quick"
          while IFS= read -r file; do
            file="${file#"${file%%[![:space:]]*}"}"
            file="${file%"${file##*[![:space:]]}"}"
            [ -z "$file" ] && continue
            echo "Classifying changed file: $file"
            case "$file" in
              docs/*|*.md|db/*|investment_knowledge_mcp/*|investment_knowledge_mcp/**/*|scripts/*.py|scripts/*.sh|deploy/systemd/*|.github/workflows/*.yml|.github/workflows/*.yaml)
                echo "  -> quick-compatible"
                ;;
              *)
                echo "  -> requires full deploy"
                mode="full"
                break
                ;;
            esac
          done < "$changed_file_list"

          if [ -z "$changed_files" ]; then
            mode="full"
          fi

          {
            echo "deploy_mode=$mode"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Selected deployment mode: $mode"

  quick_deploy:
    needs: detect_changes
    if: needs.detect_changes.outputs.deploy_mode == 'quick'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate quick deployment secrets
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
        run: |
          set -e
          for name in ECS_HOST ECS_USERNAME ECS_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          echo "Required quick deployment secrets are present."

      - name: Create quick deployment bundle
        run: |
          set -e
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./dist' \
            --exclude='./.env' \
            --exclude='./.env.test' \
            --exclude='./.env.production' \
            --exclude='./drafts' \
            --exclude='./drafts/*' \
            --exclude='./__pycache__' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            -czf dist/investment-knowledge-release.tar.gz .
          ls -lh dist/investment-knowledge-release.tar.gz

      - name: Prepare ECS base tools
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e
            sudo rm -f /tmp/investment-knowledge-release.tar.gz /tmp/investment-knowledge-images.tar.gz
            if command -v tar >/dev/null 2>&1 && command -v git >/dev/null 2>&1; then
              echo "ECS base tools are ready."
              exit 0
            fi
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y tar git
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y tar git
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y tar git
            else
              echo "Unsupported Linux distribution: cannot install tar/git automatically."
              exit 1
            fi

      - name: Upload quick deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "dist/investment-knowledge-release.tar.gz"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      - name: Quick deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR=/opt/investment-knowledge
            DEPLOY_REPO_DIR=/opt/investment-knowledge-repo
            DEPLOY_REPO_URL=https://github.com/coolCodeStudy/TurenAgentTool.git
            RELEASE_TAR=/tmp/investment-knowledge-release.tar.gz

            test -f "$RELEASE_TAR"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$(id -un)":"$(id -gn)" "$APP_DIR"

            rm -rf "$APP_DIR/db" "$APP_DIR/investment_knowledge_mcp" "$APP_DIR/scripts"
            tar -xzf "$RELEASE_TAR" -C "$APP_DIR"
            cd "$APP_DIR"
            chmod +x scripts/*.sh 2>/dev/null || true

            if docker ps >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
            elif sudo docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE="sudo docker compose"
            else
              DOCKER_COMPOSE=""
            fi

            if [ -n "$DOCKER_COMPOSE" ] && [ -f docker-compose.prod.yml ]; then
              if systemctl cat hermes-gateway.service >/dev/null 2>&1; then
                echo "Hermes gateway is installed but DingTalk is temporarily routed back to legacy dingtalk-stream-bot."
                systemctl stop hermes-gateway.service || true
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build postgres
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate mcp
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate account-snapshot-scheduler
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate ipo-reminder-scheduler
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate dingtalk-stream-bot
              else
                echo "Hermes gateway is not installed; restarting legacy dingtalk-stream-bot."
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build postgres
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate account-snapshot-scheduler
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate ipo-reminder-scheduler
                $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build --force-recreate dingtalk-stream-bot
              fi
              $DOCKER_COMPOSE -f docker-compose.prod.yml ps
              $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=80 account-snapshot-scheduler || true
              $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=80 ipo-reminder-scheduler || true
              $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=80 dingtalk-stream-bot || true
              $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=80 mcp || true
              if [ -f scripts/install_ops_api_on_ecs.sh ] && [ -f .env ]; then
                sudo mkdir -p "$DEPLOY_REPO_DIR"
                sudo chown -R "$(id -un)":"$(id -gn)" "$DEPLOY_REPO_DIR"
                if [ -d "$DEPLOY_REPO_DIR/.git" ]; then
                  git -C "$DEPLOY_REPO_DIR" remote set-url origin "$DEPLOY_REPO_URL"
                  git -C "$DEPLOY_REPO_DIR" fetch --prune origin
                else
                  rm -rf "$DEPLOY_REPO_DIR"
                  git clone "$DEPLOY_REPO_URL" "$DEPLOY_REPO_DIR"
                fi
                git -C "$DEPLOY_REPO_DIR" checkout --detach "${{ github.sha }}"
                git -C "$DEPLOY_REPO_DIR" rev-parse HEAD
                sudo \
                  INVESTMENT_DIR="$APP_DIR" \
                  OPS_DEPLOY_REPO_DIR="$DEPLOY_REPO_DIR" \
                  OPS_API_DEPLOY_TIMEOUT_SECONDS="${{ vars.OPS_API_DEPLOY_TIMEOUT_SECONDS || '600' }}" \
                  OPS_DEPLOY_ALLOWED_REFS="${{ vars.OPS_DEPLOY_ALLOWED_REFS || 'main' }}" \
                  bash scripts/install_ops_api_on_ecs.sh --start
                systemctl status investment-ops-api.service --no-pager || true
                if [ -f /etc/investment-knowledge/ops-api.env ]; then
                  . /etc/investment-knowledge/ops-api.env
                  curl -s "http://${OPS_API_HOST:-127.0.0.1}:${OPS_API_PORT:-8767}/health" || true
                fi
              fi
              if [ -f scripts/install_research_agent_worker_on_ecs.sh ] && [ -f /etc/investment-knowledge/codex-worker.env ]; then
                sudo bash scripts/install_research_agent_worker_on_ecs.sh --start || true
                systemctl status investment-research-agent-worker.service --no-pager || true
              fi
              systemctl status hermes-gateway.service --no-pager || true
              journalctl -u hermes-gateway.service -n 160 --no-pager || true
            else
              echo "Docker Compose unavailable; files were synced without service restart."
            fi

            echo "Quick deploy completed. Docker image was not rebuilt."
            echo "Changed files:"
            cat <<'EOF'
            ${{ needs.detect_changes.outputs.changed_files }}
            EOF

  full_deploy:
    needs: detect_changes
    if: needs.detect_changes.outputs.deploy_mode == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          COMMAND_API_TOKEN: ${{ secrets.COMMAND_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DINGTALK_STREAM_CLIENT_ID: ${{ secrets.DINGTALK_STREAM_CLIENT_ID }}
          DINGTALK_STREAM_CLIENT_SECRET: ${{ secrets.DINGTALK_STREAM_CLIENT_SECRET }}
        run: |
          set -e
          for name in \
            ECS_HOST \
            ECS_USERNAME \
            ECS_PASSWORD \
            POSTGRES_PASSWORD \
            COMMAND_API_TOKEN \
            OPENAI_API_KEY \
            DINGTALK_STREAM_CLIENT_ID \
            DINGTALK_STREAM_CLIENT_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          echo "Required deployment secrets are present."

      - name: Create deployment bundle
        run: |
          set -e
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./dist' \
            --exclude='./.env' \
            --exclude='./.env.test' \
            --exclude='./.env.production' \
            --exclude='./drafts' \
            --exclude='./drafts/*' \
            --exclude='./__pycache__' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            -czf dist/investment-knowledge-release.tar.gz .

      - name: Build deployment images
        run: |
          set -e
          docker build \
            --build-arg PIP_INDEX_URL="${{ vars.PIP_INDEX_URL || 'https://mirrors.aliyun.com/pypi/simple/' }}" \
            -t investment-knowledge-app:prod \
            .
          docker pull pgvector/pgvector:pg16
          docker save investment-knowledge-app:prod pgvector/pgvector:pg16 | gzip > dist/investment-knowledge-images.tar.gz
          ls -lh dist/investment-knowledge-release.tar.gz dist/investment-knowledge-images.tar.gz

      - name: Prepare ECS dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 40m
          script: |
            set -e

            install_base_tools() {
              if command -v tar >/dev/null 2>&1 && command -v curl >/dev/null 2>&1 && command -v git >/dev/null 2>&1; then
                return
              fi

              echo "Installing base tools: tar, curl, git, ca-certificates"
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y tar curl git ca-certificates
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y tar curl git ca-certificates
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y tar curl git ca-certificates
              else
                echo "Unsupported Linux distribution: cannot install base tools automatically."
                exit 1
              fi
            }

            install_docker() {
              if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
                return
              fi
              if command -v docker >/dev/null 2>&1 && sudo docker compose version >/dev/null 2>&1; then
                return
              fi

              echo "Installing Docker Engine and Docker Compose plugin"
              if command -v apt-get >/dev/null 2>&1; then
                . /etc/os-release
                sudo apt-get update
                sudo apt-get install -y ca-certificates curl
                sudo install -m 0755 -d /etc/apt/keyrings
                curl -fsSL "https://download.docker.com/linux/${ID}/gpg" | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
                sudo chmod a+r /etc/apt/keyrings/docker.asc
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${ID} ${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
                sudo apt-get update
                sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y yum-utils
                sudo yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                sudo yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y dnf-plugins-core
                sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              else
                echo "Unsupported Linux distribution: cannot install Docker automatically."
                exit 1
              fi
            }

            start_docker() {
              sudo systemctl enable docker >/dev/null 2>&1 || true
              sudo systemctl start docker >/dev/null 2>&1 || sudo service docker start
            }

            resolve_compose_command() {
              if docker ps >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
                DOCKER="docker"
                DOCKER_COMPOSE="docker compose"
              elif sudo docker compose version >/dev/null 2>&1; then
                DOCKER="sudo docker"
                DOCKER_COMPOSE="sudo docker compose"
              else
                echo "Docker Compose plugin is not available after installation."
                exit 1
              fi
            }

            install_base_tools
            install_docker
            start_docker
            resolve_compose_command
            sudo rm -f /tmp/investment-knowledge-release.tar.gz /tmp/investment-knowledge-images.tar.gz

            echo "ECS dependencies are ready."

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "dist/investment-knowledge-release.tar.gz,dist/investment-knowledge-images.tar.gz"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 60m
          script: |
            set -e

            resolve_compose_command() {
              if docker ps >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
                DOCKER="docker"
                DOCKER_COMPOSE="docker compose"
              elif sudo docker compose version >/dev/null 2>&1; then
                DOCKER="sudo docker"
                DOCKER_COMPOSE="sudo docker compose"
              else
                echo "Docker Compose plugin is not available."
                exit 1
              fi
            }

            resolve_compose_command

            APP_DIR=/opt/investment-knowledge
            DEPLOY_REPO_DIR=/opt/investment-knowledge-repo
            DEPLOY_REPO_URL=https://github.com/coolCodeStudy/TurenAgentTool.git
            RELEASE_TAR=/tmp/investment-knowledge-release.tar.gz
            IMAGE_TAR=/tmp/investment-knowledge-images.tar.gz
            RELEASE_DIR=/tmp/investment-knowledge-release

            test -f "$RELEASE_TAR"
            test -f "$IMAGE_TAR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$RELEASE_TAR" -C "$RELEASE_DIR"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$(id -un)":"$(id -gn)" "$APP_DIR"

            find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$RELEASE_DIR"/. "$APP_DIR"/
            cd "$APP_DIR"

            cat > .env <<'ENV'
            COMPOSE_PROJECT_NAME=turenagenttool_prod
            COMPOSE_PROFILES=stream
            APP_IMAGE_TAG=prod
            PIP_INDEX_URL=${{ vars.PIP_INDEX_URL || 'https://mirrors.aliyun.com/pypi/simple/' }}

            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=investment_kg
            POSTGRES_HOST_PORT=${{ vars.POSTGRES_HOST_PORT || '55432' }}

            MCP_TRANSPORT=streamable-http
            MCP_HOST=0.0.0.0
            MCP_PORT=8000
            MCP_HOST_PORT=8000
            MCP_PATH=/mcp

            COMMAND_API_HOST=0.0.0.0
            COMMAND_API_PORT=8001
            COMMAND_API_HOST_PORT=8001
            COMMAND_API_TOKEN=${{ secrets.COMMAND_API_TOKEN }}

            DINGTALK_API_HOST=0.0.0.0
            DINGTALK_API_PORT=8002
            DINGTALK_API_HOST_PORT=8002
            DINGTALK_OUTGOING_SECRET=${{ secrets.DINGTALK_OUTGOING_SECRET }}
            DINGTALK_ALLOW_WRITE_COMMANDS=false
            DINGTALK_SEND_WEBHOOK=${{ secrets.DINGTALK_SEND_WEBHOOK }}
            DINGTALK_SEND_SECRET=${{ secrets.DINGTALK_SEND_SECRET }}
            DINGTALK_STREAM_CLIENT_ID=${{ secrets.DINGTALK_STREAM_CLIENT_ID }}
            DINGTALK_STREAM_CLIENT_SECRET=${{ secrets.DINGTALK_STREAM_CLIENT_SECRET }}
            DINGTALK_STREAM_ALLOW_WRITE=${{ vars.DINGTALK_STREAM_ALLOW_WRITE || 'false' }}
            DINGTALK_STREAM_WRITE_ALLOWED_SENDERS=${{ secrets.DINGTALK_STREAM_WRITE_ALLOWED_SENDERS || '0140522255091257971' }}
            DINGTALK_COMMAND_TIMEOUT_SECONDS=${{ vars.DINGTALK_COMMAND_TIMEOUT_SECONDS || '25' }}
            DINGTALK_IPO_REMINDERS_ENABLED=${{ vars.DINGTALK_IPO_REMINDERS_ENABLED || 'true' }}
            DINGTALK_IPO_REMINDER_INTERVAL_SECONDS=${{ vars.DINGTALK_IPO_REMINDER_INTERVAL_SECONDS || '300' }}

            FUTU_OPEND_HOST=${{ vars.FUTU_OPEND_HOST || 'host.docker.internal' }}
            FUTU_OPEND_PORT=${{ vars.FUTU_OPEND_PORT || '11112' }}
            FUTU_OPEND_TELNET_HOST=${{ vars.FUTU_OPEND_TELNET_HOST || 'host.docker.internal' }}
            FUTU_OPEND_TELNET_PORT=${{ vars.FUTU_OPEND_TELNET_PORT || '22222' }}
            FUTU_SECURITY_FIRM=${{ vars.FUTU_SECURITY_FIRM || 'FUTUSECURITIES' }}
            FUTU_TRADE_MARKET=${{ vars.FUTU_TRADE_MARKET || 'HK' }}
            FUTU_TRADE_ENV=${{ vars.FUTU_TRADE_ENV || 'REAL' }}
            FUTU_ACCOUNT_ID=${{ vars.FUTU_ACCOUNT_ID || '0' }}
            FUTU_ACCOUNT_INDEX=${{ vars.FUTU_ACCOUNT_INDEX || '0' }}
            FUTU_POSITION_CACHE_SECONDS=${{ vars.FUTU_POSITION_CACHE_SECONDS || '20' }}
            FUTU_POSITION_REFRESH_CACHE=${{ vars.FUTU_POSITION_REFRESH_CACHE || 'true' }}

            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL || 'gpt-5.2' }}
            OPENAI_ANALYSIS_ENABLED=true

            OPS_API_URL=${{ vars.OPS_API_URL || 'http://host.docker.internal:8767' }}
            OPS_API_TOKEN=${{ secrets.OPS_API_TOKEN || secrets.COMMAND_API_TOKEN }}
            OPS_API_TIMEOUT_SECONDS=${{ vars.OPS_API_TIMEOUT_SECONDS || '8' }}
            OPS_API_DEPLOY_TIMEOUT_SECONDS=${{ vars.OPS_API_DEPLOY_TIMEOUT_SECONDS || '600' }}
            ENV

            sed -i 's/^            //' .env
            chmod 600 .env

            sudo mkdir -p "$DEPLOY_REPO_DIR"
            sudo chown -R "$(id -un)":"$(id -gn)" "$DEPLOY_REPO_DIR"
            if [ -d "$DEPLOY_REPO_DIR/.git" ]; then
              git -C "$DEPLOY_REPO_DIR" remote set-url origin "$DEPLOY_REPO_URL"
              git -C "$DEPLOY_REPO_DIR" fetch --prune origin
            else
              rm -rf "$DEPLOY_REPO_DIR"
              git clone "$DEPLOY_REPO_URL" "$DEPLOY_REPO_DIR"
            fi
            git -C "$DEPLOY_REPO_DIR" checkout --detach "${{ github.sha }}"
            git -C "$DEPLOY_REPO_DIR" rev-parse HEAD

            sudo \
              INVESTMENT_DIR="$APP_DIR" \
              OPS_DEPLOY_REPO_DIR="$DEPLOY_REPO_DIR" \
              OPS_API_DEPLOY_TIMEOUT_SECONDS="${{ vars.OPS_API_DEPLOY_TIMEOUT_SECONDS || '600' }}" \
              OPS_DEPLOY_ALLOWED_REFS="${{ vars.OPS_DEPLOY_ALLOWED_REFS || 'main' }}" \
              bash scripts/install_ops_api_on_ecs.sh --start
            if [ -f /etc/investment-knowledge/ops-api.env ]; then
              . /etc/investment-knowledge/ops-api.env
              curl -s "http://${OPS_API_HOST:-127.0.0.1}:${OPS_API_PORT:-8767}/health" || true
            fi
            if [ -f scripts/install_research_agent_worker_on_ecs.sh ] && [ -f /etc/investment-knowledge/codex-worker.env ]; then
              sudo bash scripts/install_research_agent_worker_on_ecs.sh --start || true
              systemctl status investment-research-agent-worker.service --no-pager || true
            fi

            gzip -dc "$IMAGE_TAR" | $DOCKER load
            $DOCKER_COMPOSE -f docker-compose.prod.yml config
            if systemctl cat hermes-gateway.service >/dev/null 2>&1; then
              echo "Hermes gateway is installed but DingTalk is temporarily routed back to legacy dingtalk-stream-bot."
              systemctl stop hermes-gateway.service || true
              $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build postgres mcp account-snapshot-scheduler ipo-reminder-scheduler dingtalk-stream-bot
            else
              echo "Hermes gateway is not installed; restarting legacy dingtalk-stream-bot."
              $DOCKER_COMPOSE -f docker-compose.prod.yml up -d --no-build postgres account-snapshot-scheduler ipo-reminder-scheduler dingtalk-stream-bot
            fi
            $DOCKER_COMPOSE -f docker-compose.prod.yml ps
            sleep 20
            $DOCKER_COMPOSE -f docker-compose.prod.yml ps
            $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=200 account-snapshot-scheduler || true
            $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=200 ipo-reminder-scheduler || true
            $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=200 dingtalk-stream-bot || true
            $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=200 mcp || true
            $DOCKER_COMPOSE -f docker-compose.prod.yml logs --tail=80 postgres || true
            systemctl status hermes-gateway.service --no-pager || true
            journalctl -u hermes-gateway.service -n 160 --no-pager || true
