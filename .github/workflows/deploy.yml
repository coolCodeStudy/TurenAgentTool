name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Production source ref: main or a 40-character SHA"
        required: false
        default: "main"
        type: string
      deploy_mode:
        description: "Deployment mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - no_deploy
          - targeted_quick
          - config_restart
          - full_image
      emergency_reason:
        description: "Optional emergency reason for a manually requested full deployment"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.plan.outputs.target_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      targets_csv: ${{ steps.plan.outputs.targets_csv }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      emergency_reason: ${{ steps.plan.outputs.emergency_reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build server-authoritative deployment plan
        id: plan
        env:
          OPS_API_URL: ${{ vars.OPS_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN || secrets.COMMAND_API_TOKEN }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'main' }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'auto' }}
          EMERGENCY_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reason || '' }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$OPS_API_URL" ] || [ -z "$OPS_API_TOKEN" ]; then
            echo "::error::OPS_API_URL and OPS_API_TOKEN/COMMAND_API_TOKEN are required."
            exit 1
          fi

          if ! printf '%s' "$REQUESTED_REF" | grep -Eq '^(main|[0-9a-f]{40})$'; then
            echo "::error::Manual target_ref must be main or a 40-character SHA."
            exit 1
          fi

          git fetch --prune origin main
          if [ "$REQUESTED_REF" = "main" ]; then
            target_sha="$WORKFLOW_SHA"
          else
            target_sha="$REQUESTED_REF"
            if [ "$target_sha" != "$WORKFLOW_SHA" ]; then
              echo "::error::Manual SHA dispatch must run from the same 40-character SHA."
              exit 1
            fi
          fi

          if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then
            echo "::error::Target SHA is not present in the checked-out repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "::error::Target SHA is not reachable from origin/main."
            exit 1
          fi

          status_json="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $OPS_API_TOKEN" \
            "$OPS_API_URL/deploy/status" > "$status_json"

          base_sha="$(
            python3 - "$status_json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          current_sha = (payload.get("data") or {}).get("current_sha")
          if not isinstance(current_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", current_sha):
              raise SystemExit("deploy status did not return a 40-character current_sha")
          print(current_sha)
          PY
          )"

          plan_json="$(mktemp)"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            python3 scripts/classify_deploy_change.py \
              --repo . \
              --base-sha "$base_sha" \
              --target-sha "$target_sha" \
              --format json > "$plan_json"
          else
            python3 scripts/classify_deploy_change.py \
              --manual-mode "$REQUESTED_MODE" \
              --format json > "$plan_json"
          fi

          python3 - "$plan_json" "$target_sha" "$base_sha" "$EMERGENCY_REASON" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          plan_path, target_sha, base_sha, emergency_reason = sys.argv[1:5]
          with open(plan_path, encoding="utf-8") as handle:
              plan = json.load(handle)
          targets = plan.get("targets") or []
          print(f"target_sha={target_sha}")
          print(f"base_sha={base_sha}")
          print(f"mode={plan['mode']}")
          print(f"targets={json.dumps(targets, separators=(',', ':'))}")
          print(f"targets_csv={','.join(targets)}")
          print(f"emergency_reason={emergency_reason}")
          print("plan_json<<EOF")
          print(json.dumps(plan, ensure_ascii=False, indent=2))
          print("EOF")
          PY

          echo "Deployment plan:"
          cat "$plan_json"

  no_deploy:
    needs: plan
    if: needs.plan.outputs.mode == 'no_deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm no deployment needed
        run: |
          echo "No production deployment needed."
          cat <<'EOF'
          ${{ needs.plan.outputs.plan_json }}
          EOF

  shared_deploy:
    needs: plan
    if: needs.plan.outputs.mode == 'targeted_quick' || needs.plan.outputs.mode == 'config_restart'
    runs-on: ubuntu-latest

    steps:
      - name: Delegate deployment to Ops API
        env:
          OPS_API_URL: ${{ vars.OPS_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN || secrets.COMMAND_API_TOKEN }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          DEPLOY_MODE: ${{ needs.plan.outputs.mode }}
          TARGETS_JSON: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > deploy-payload.json
          import json
          import os

          payload = {
              "ref": os.environ["TARGET_SHA"],
              "mode": os.environ["DEPLOY_MODE"],
              "targets": json.loads(os.environ["TARGETS_JSON"]),
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OPS_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @deploy-payload.json \
            "$OPS_API_URL/deploy"

  full_image:
    needs: plan
    if: needs.plan.outputs.mode == 'full_image'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Build immutable application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: investment-knowledge-app:${{ github.sha }}
          build-args: |
            PIP_INDEX_URL=${{ vars.PIP_INDEX_URL || 'https://mirrors.aliyun.com/pypi/simple/' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save immutable application image archive
        id: archive
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/investment-knowledge-app-${{ github.sha }}.tar.gz"
          docker save investment-knowledge-app:${{ github.sha }} | gzip > "$archive"
          archive_bytes="$(wc -c < "$archive" | tr -d ' ')"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Remote deploy_preflight.py resource gate
        uses: appleboy/ssh-action@v1.0.3
        env:
          ARCHIVE_BYTES: ${{ steps.archive.outputs.archive_bytes }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 15m
          envs: ARCHIVE_BYTES,TARGET_SHA
          script: |
            set -euo pipefail

            DEPLOY_REPO_DIR=/opt/investment-knowledge-repo
            DEPLOY_REPO_URL=https://github.com/coolCodeStudy/TurenAgentTool.git
            APP_ROOT=/opt/investment-knowledge

            sudo mkdir -p "$APP_ROOT" "$DEPLOY_REPO_DIR"
            sudo chown -R "$(id -un)":"$(id -gn)" "$APP_ROOT" "$DEPLOY_REPO_DIR"
            if [ -d "$DEPLOY_REPO_DIR/.git" ]; then
              git -C "$DEPLOY_REPO_DIR" remote set-url origin "$DEPLOY_REPO_URL"
              git -C "$DEPLOY_REPO_DIR" fetch --prune origin
            else
              rm -rf "$DEPLOY_REPO_DIR"
              git clone "$DEPLOY_REPO_URL" "$DEPLOY_REPO_DIR"
            fi
            git -C "$DEPLOY_REPO_DIR" checkout --detach "$TARGET_SHA"

            echo "Running deploy_preflight.py before image archive upload."
            python3 - "$DEPLOY_REPO_DIR" "$ARCHIVE_BYTES" <<'PY'
            from pathlib import Path
            import sys

            repo = Path(sys.argv[1])
            archive_bytes = int(sys.argv[2])
            sys.path.insert(0, str(repo))

            from scripts.deploy_contract import DeployMode
            from scripts.deploy_preflight import collect_resources, evaluate_preflight, validate_runtime
            from scripts.deploy_support import SubprocessRunner

            runner = SubprocessRunner()
            snapshot = collect_resources(runner)
            result = evaluate_preflight(snapshot, DeployMode.FULL_IMAGE, archive_bytes)
            if not result.ok:
                raise SystemExit("deployment resource preflight failed: " + "; ".join(result.errors))
            compose_file = Path("/opt/investment-knowledge/current/docker-compose.prod.yml")
            labels = validate_runtime(runner, compose_file)
            print("remote preflight labels:", ",".join(labels))
            PY

      - name: Upload immutable application image archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "dist/investment-knowledge-app-${{ github.sha }}.tar.gz"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      - name: Delegate full image deployment to Ops API
        env:
          OPS_API_URL: ${{ vars.OPS_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN || secrets.COMMAND_API_TOKEN }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          TARGETS_JSON: ${{ needs.plan.outputs.targets }}
          EMERGENCY_REASON: ${{ needs.plan.outputs.emergency_reason }}
          REMOTE_ARCHIVE: /tmp/investment-knowledge-app-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail

          python3 - <<'PY' > deploy-payload.json
          import json
          import os

          payload = {
              "ref": os.environ["TARGET_SHA"],
              "mode": "full_image",
              "targets": json.loads(os.environ["TARGETS_JSON"]),
              "archive_path": os.environ["REMOTE_ARCHIVE"],
          }
          reason = os.environ.get("EMERGENCY_REASON", "").strip()
          if reason:
              payload["emergency_reason"] = reason
          print(json.dumps(payload, separators=(",", ":")))
          PY

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OPS_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data @deploy-payload.json \
            "$OPS_API_URL/deploy"
