name: ECS Ops API

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ops API operation"
        required: true
        default: "install"
        type: choice
        options:
          - install
          - start
          - status
          - stop
          - verify-deploy-events
          - recover-lockout
          - remove-legacy-gateway

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ops_api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate ECS secrets
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
        run: |
          set -e
          for name in ECS_HOST ECS_USERNAME ECS_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Upload Ops API bootstrap
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "scripts/bootstrap_ops_api_v2_on_ecs.sh"
          target: "/tmp/ops-api-${{ github.run_id }}"
          strip_components: 1
          overwrite: true

      - name: Run Ops API operation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR=/opt/investment-knowledge
            UPLOAD_DIR=/tmp/ops-api-${{ github.run_id }}
            MODE="${{ inputs.mode }}"
            DEPLOY_LOCK_PATH="$APP_DIR/shared/deploy.lock"

            run_under_deploy_lock() {
              sudo flock --exclusive --wait 600 "$DEPLOY_LOCK_PATH" "$@"
            }

            stop_ops_api_under_deploy_lock() {
              run_under_deploy_lock /bin/bash -c \
                'systemctl stop investment-ops-api.service || true'
            }

            case "$MODE" in
              install)
                stop_ops_api_under_deploy_lock
                sudo BOOTSTRAP_REF="${{ github.sha }}" \
                  APP_ROOT="$APP_DIR" \
                  OPS_HOME=/opt/investment-ops \
                  bash "$UPLOAD_DIR/bootstrap_ops_api_v2_on_ecs.sh"
                ;;
              start)
                run_under_deploy_lock systemctl restart investment-ops-api.service
                ;;
              status)
                true
                ;;
              verify-deploy-events)
                run_under_deploy_lock /bin/bash -c '
                set -euo pipefail

                APP_DIR=/opt/investment-knowledge
                if [ ! -f /etc/investment-knowledge/ops-api.env ]; then
                  echo "Missing /etc/investment-knowledge/ops-api.env" >&2
                  exit 1
                fi

                set -a
                # shellcheck disable=SC1091
                . /etc/investment-knowledge/ops-api.env
                set +a

                PYTHON_BIN="${OPS_API_PYTHON_BIN:-python3}"
                if [ ! -x "$PYTHON_BIN" ]; then
                  echo "OPS API Python is not executable: $PYTHON_BIN" >&2
                  exit 1
                fi

                event_id="$("$PYTHON_BIN" "$APP_DIR/scripts/record_deploy_event.py" start \
                  --source verification \
                  --deploy-mode quick \
                  --summary "verify deploy event recorder")"
                echo "verify deploy event start id: $event_id"

                "$PYTHON_BIN" "$APP_DIR/scripts/record_deploy_event.py" finish \
                  --id "$event_id" \
                  --status succeeded \
                  --summary "verify deploy event recorder succeeded" >/dev/null
                echo "verify deploy event finish id: $event_id"
                '
                ;;
              recover-lockout)
                stop_ops_api_under_deploy_lock
                sudo BOOTSTRAP_REF="${{ github.sha }}" \
                  APP_ROOT="$APP_DIR" \
                  OPS_HOME=/opt/investment-ops \
                  RECOVER_DEPLOY_LOCKOUT=true \
                  bash "$UPLOAD_DIR/bootstrap_ops_api_v2_on_ecs.sh"
                ;;
              remove-legacy-gateway)
                run_under_deploy_lock /bin/bash -c '
                systemctl disable --now hermes-gateway.service || true
                rm -f /etc/systemd/system/hermes-gateway.service
                systemctl daemon-reload
                rm -rf /opt/hermes-agent /root/.hermes
                echo "legacy gateway removed"
                '
                ;;
              stop)
                run_under_deploy_lock /bin/bash -c \
                  'systemctl disable --now investment-ops-api.service || true'
                ;;
              *)
                echo "Unknown mode: $MODE"
                exit 1
                ;;
            esac

            sudo systemctl status investment-ops-api.service --no-pager || true
            sudo journalctl -u investment-ops-api.service -n 80 --no-pager || true

            if [ "$MODE" != "stop" ]; then
              echo "Verify private Ops API health"
              sudo /bin/bash -c '
              set -euo pipefail
              . /etc/investment-knowledge/ops-api.env
              curl --connect-timeout 3 --max-time 5 --fail --silent --show-error \
                "http://${OPS_API_HOST:-127.0.0.1}:${OPS_API_PORT:-8767}/health"
              '
            fi
