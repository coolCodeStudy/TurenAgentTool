name: Protected browser acceptance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed application base URL to test
        required: true
        default: http://47.84.190.191:8010
        type: string

jobs:
  desktop-protected:
    name: Feature-scoped protected fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run protected browser acceptance when configured
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_PROTECTED_NO_ARTIFACTS: "1"
          E2E_PROTECTED_ACCESS_TOKEN: ${{ secrets.E2E_PROTECTED_ACCESS_TOKEN }}
        run: |
          if [ -z "$E2E_PROTECTED_ACCESS_TOKEN" ]; then
            echo "No protected fixture is configured; no protected test was run."
            exit 0
          fi
          npm run test:e2e:cloud -- --project=desktop-protected
