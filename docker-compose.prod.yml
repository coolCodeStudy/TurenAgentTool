services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-investment_kg}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-investment_kg}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_PATH: ${MCP_PATH:-/mcp}
    ports:
      - "${MCP_HOST_PORT:-8000}:${MCP_PORT:-8000}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.server"]

  command-api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-investment_kg}
      COMMAND_API_HOST: ${COMMAND_API_HOST:-0.0.0.0}
      COMMAND_API_PORT: ${COMMAND_API_PORT:-8001}
      COMMAND_API_TOKEN: ${COMMAND_API_TOKEN:?COMMAND_API_TOKEN is required}
    ports:
      - "${COMMAND_API_HOST_PORT:-8001}:${COMMAND_API_PORT:-8001}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.command_api"]

volumes:
  postgres_prod_data:
