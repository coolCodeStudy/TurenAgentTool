      OPS_API_URL: ${OPS_API_URL:-http://host.docker.internal:8767}
      OPS_API_TOKEN: ${OPS_API_TOKEN:-${COMMAND_API_TOKEN:-}}
    ports:
      - "${DINGTALK_API_HOST_PORT:-8002}:${DINGTALK_API_PORT:-8002}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.dingtalk_api"]

  dingtalk-stream-bot:
    profiles: ["stream"]
    image: investment-knowledge-app:${APP_IMAGE_TAG:-prod}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/app/db:ro
      - ./investment_knowledge_mcp:/app/investment_knowledge_mcp:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
      DINGTALK_STREAM_CLIENT_ID: ${DINGTALK_STREAM_CLIENT_ID:?DINGTALK_STREAM_CLIENT_ID is required}
      DINGTALK_STREAM_CLIENT_SECRET: ${DINGTALK_STREAM_CLIENT_SECRET:?DINGTALK_STREAM_CLIENT_SECRET is required}
      DINGTALK_STREAM_ALLOW_WRITE: ${DINGTALK_STREAM_ALLOW_WRITE:-false}
      DINGTALK_STREAM_WRITE_ALLOWED_SENDERS: ${DINGTALK_STREAM_WRITE_ALLOWED_SENDERS:-}
      DINGTALK_COMMAND_TIMEOUT_SECONDS: ${DINGTALK_COMMAND_TIMEOUT_SECONDS:-25}
      DINGTALK_SEND_WEBHOOK: ${DINGTALK_SEND_WEBHOOK:-}
      DINGTALK_SEND_SECRET: ${DINGTALK_SEND_SECRET:-}
      DINGTALK_IPO_REMINDERS_ENABLED: ${DINGTALK_IPO_REMINDERS_ENABLED:-true}
      DINGTALK_IPO_REMINDER_INTERVAL_SECONDS: ${DINGTALK_IPO_REMINDER_INTERVAL_SECONDS:-300}
      FUTU_OPEND_HOST: ${FUTU_OPEND_HOST:-host.docker.internal}
      FUTU_OPEND_PORT: ${FUTU_OPEND_PORT:-11112}
      FUTU_OPEND_TELNET_HOST: ${FUTU_OPEND_TELNET_HOST:-host.docker.internal}
      FUTU_OPEND_TELNET_PORT: ${FUTU_OPEND_TELNET_PORT:-22222}
      FUTU_SECURITY_FIRM: ${FUTU_SECURITY_FIRM:-FUTUSECURITIES}
      FUTU_TRADE_MARKET: ${FUTU_TRADE_MARKET:-HK}
      FUTU_TRADE_ENV: ${FUTU_TRADE_ENV:-REAL}
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID:-0}
      FUTU_ACCOUNT_INDEX: ${FUTU_ACCOUNT_INDEX:-0}
      FUTU_POSITION_CACHE_SECONDS: ${FUTU_POSITION_CACHE_SECONDS:-20}
      FUTU_POSITION_REFRESH_CACHE: ${FUTU_POSITION_REFRESH_CACHE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
      OPS_API_URL: ${OPS_API_URL:-http://host.docker.internal:8767}
      OPS_API_TOKEN: ${OPS_API_TOKEN:-${COMMAND_API_TOKEN:-}}
    command:
      - sh
      - -c
      - >
        python scripts/init_db.py &&
        if [ "$$DINGTALK_STREAM_ALLOW_WRITE" = "true" ]; then
          python scripts/dingtalk_stream_bot.py --allow-write;
        else
          python scripts/dingtalk_stream_bot.py;
        fi

  ipo-reminder-scheduler:
