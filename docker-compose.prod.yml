services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-investment_kg}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp:
    profiles: ["http"]
    image: investment-knowledge-app:${APP_IMAGE_TAG:-prod}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_PATH: ${MCP_PATH:-/mcp}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
    ports:
      - "${MCP_HOST_PORT:-8000}:${MCP_PORT:-8000}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.server"]

  command-api:
    profiles: ["http"]
    image: investment-knowledge-app:${APP_IMAGE_TAG:-prod}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
      COMMAND_API_HOST: ${COMMAND_API_HOST:-0.0.0.0}
      COMMAND_API_PORT: ${COMMAND_API_PORT:-8001}
      COMMAND_API_TOKEN: ${COMMAND_API_TOKEN:?COMMAND_API_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
    ports:
      - "${COMMAND_API_HOST_PORT:-8001}:${COMMAND_API_PORT:-8001}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.command_api"]

  dingtalk-api:
    profiles: ["http"]
    image: investment-knowledge-app:${APP_IMAGE_TAG:-prod}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
      DINGTALK_API_HOST: ${DINGTALK_API_HOST:-0.0.0.0}
      DINGTALK_API_PORT: ${DINGTALK_API_PORT:-8002}
      DINGTALK_OUTGOING_SECRET: ${DINGTALK_OUTGOING_SECRET:-}
      DINGTALK_ALLOW_WRITE_COMMANDS: ${DINGTALK_ALLOW_WRITE_COMMANDS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
    ports:
      - "${DINGTALK_API_HOST_PORT:-8002}:${DINGTALK_API_PORT:-8002}"
    command: ["sh", "-c", "python scripts/init_db.py && python -m investment_knowledge_mcp.dingtalk_api"]

  dingtalk-stream-bot:
    profiles: ["stream"]
    image: investment-knowledge-app:${APP_IMAGE_TAG:-prod}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_kg}
      DINGTALK_STREAM_CLIENT_ID: ${DINGTALK_STREAM_CLIENT_ID:?DINGTALK_STREAM_CLIENT_ID is required}
      DINGTALK_STREAM_CLIENT_SECRET: ${DINGTALK_STREAM_CLIENT_SECRET:?DINGTALK_STREAM_CLIENT_SECRET is required}
      DINGTALK_STREAM_ALLOW_WRITE: ${DINGTALK_STREAM_ALLOW_WRITE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_ANALYSIS_ENABLED: ${OPENAI_ANALYSIS_ENABLED:-true}
    command:
      - sh
      - -c
      - >
        python scripts/init_db.py &&
        if [ "$$DINGTALK_STREAM_ALLOW_WRITE" = "true" ]; then
          python scripts/dingtalk_stream_bot.py --allow-write;
        else
          python scripts/dingtalk_stream_bot.py;
        fi

volumes:
  postgres_prod_data:
