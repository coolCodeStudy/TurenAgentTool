services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: investment-knowledge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investment_kg
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investment_kg"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
